services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvas_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: canvas_lab
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://canvas_lab:${POSTGRES_PASSWORD}@db:5432/canvas_lab
      AGENT_API_KEY: ${AGENT_API_KEY}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      CORS_ORIGINS: https://${DOMAIN}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Only reachable from this machine itself. Tailscale Funnel is what
      # exposes it to the public internet (does its own HTTPS), so this is
      # never bound to 0.0.0.0 / the lab network.
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:
